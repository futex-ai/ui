  - rowgroup:
    - row /1 We shipped per-step tool scoping today — every agent step runs with only the tools it was granted\. Drafted \d+\.\d+ twitter\/x Cal launch infra \d+ Jun \d+/:
      - rowheader "1"
      - gridcell "We shipped per-step tool scoping today — every agent step runs with only the tools it was granted."
      - gridcell "Drafted"
      - gridcell /\d+\.\d+/
      - gridcell "twitter/x"
      - gridcell "Cal"
      - gridcell "launch infra"
      - gridcell /\d+ Jun \d+/
    - row /2 Why we moved every workflow run into a fresh container Approved \d+\.\d+ twitter\/x Cal infra \d+ Jun \d+/:
      - rowheader "2"
      - gridcell "Why we moved every workflow run into a fresh container"
      - gridcell "Approved"
      - gridcell /\d+\.\d+/
      - gridcell "twitter/x"
      - gridcell "Cal"
      - gridcell "infra"
      - gridcell /\d+ Jun \d+/
    - row "New record":
      - gridcell "New record":
        - button "New record"
- text: "/2 of \\d+ records `maxHeight` sets a fixed body height; with fewer rows than fit, the space below the last row is a quiet grey empty zone\\./"