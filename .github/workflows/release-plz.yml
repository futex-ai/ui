name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release From Merged Release PR
    if: github.repository == 'futex-ai/ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release
        uses: release-plz/action@v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: Update Release PR
    if: github.repository == 'futex-ai/ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release-pr
        id: release-plz
        uses: release-plz/action@v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out release PR branch
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != 'null'
        id: release-pr
        env:
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch="$(printf "%s" "${RELEASE_PR}" | jq -r ".head_branch")"
          version="$(printf "%s" "${RELEASE_PR}" | jq -r ".releases[0].version")"
          if [ -z "${branch}" ] || [ "${branch}" = "null" ]; then
            echo "::error title=Missing release PR branch::release-plz did not return a head branch."
            exit 1
          fi
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error title=Missing release version::release-plz did not return a package version."
            exit 1
          fi
          git fetch origin "${branch}"
          git checkout "${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sync npm metadata
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != 'null'
        run: cargo xtask sync-package-version --version "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ steps.release-pr.outputs.version }}

      - name: Commit synced npm metadata
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != 'null'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "npm metadata already matches release-plz version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync npm package version"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${RELEASE_BRANCH}"
