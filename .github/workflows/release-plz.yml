name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_ref:
        description: Existing vX.Y.Z tag to publish.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Release @firna/ui
    if: github.repository == 'futex-ai/ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Run release-please
        if: github.event_name == 'push'
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve release PR branch
        if: github.event_name == 'push' && steps.release.outputs.prs_created == 'true'
        id: release-pr
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail

          branch="$(
            node <<'NODE'
          const singlePr = process.env.RELEASE_PR;
          const releasePrs = process.env.RELEASE_PRS;
          const parsedPr = singlePr
            ? JSON.parse(singlePr)
            : JSON.parse(releasePrs || "[]")[0];

          if (!parsedPr?.headBranchName) {
            throw new Error("release-please did not return a release PR head branch");
          }

          console.log(parsedPr.headBranchName);
          NODE
          )"

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Check out release PR branch
        if: github.event_name == 'push' && steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node for release PR formatting
        if: github.event_name == 'push' && steps.release.outputs.prs_created == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install release PR dependencies
        if: github.event_name == 'push' && steps.release.outputs.prs_created == 'true'
        run: npm ci

      - name: Format release PR
        if: github.event_name == 'push' && steps.release.outputs.prs_created == 'true'
        run: npm run format

      - name: Commit formatted release PR
        if: github.event_name == 'push' && steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Release PR already matches repository formatting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format release PR"
          git push origin "HEAD:${RELEASE_PR_BRANCH}"

      - name: Resolve publish target
        id: publish-target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_REF: ${{ github.event.inputs.publish_ref || '' }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -z "${PUBLISH_REF}" ]; then
              echo "::error title=Missing publish ref::Provide an existing vX.Y.Z tag."
              exit 1
            fi
            if [[ ! "${PUBLISH_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Invalid publish ref::Expected an existing vX.Y.Z tag, got ${PUBLISH_REF}."
              exit 1
            fi
            {
              echo "should_publish=true"
              echo "ref=${PUBLISH_REF}"
              echo "tag=${PUBLISH_REF}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${RELEASE_CREATED}" = "true" ]; then
            if [ -z "${RELEASE_SHA}" ] || [ -z "${RELEASE_TAG}" ]; then
              echo "::error title=Missing release target::release-please did not return a release SHA and tag."
              exit 1
            fi
            {
              echo "should_publish=true"
              echo "ref=${RELEASE_SHA}"
              echo "tag=${RELEASE_TAG}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_publish=false" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.publish-target.outputs.should_publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.publish-target.outputs.ref }}

      - name: Set up Node
        if: steps.publish-target.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        if: steps.publish-target.outputs.should_publish == 'true'
        run: npm install --global npm@11.7.0

      - name: Set up Rust
        if: steps.publish-target.outputs.should_publish == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        if: steps.publish-target.outputs.should_publish == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.publish-target.outputs.should_publish == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify release version
        if: steps.publish-target.outputs.should_publish == 'true'
        id: version
        run: |
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "${RELEASE_TAG}" != "v${package_version}" ]; then
            echo "::error title=Tag/version mismatch::Expected tag v${package_version}, got ${RELEASE_TAG}."
            exit 1
          fi
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ steps.publish-target.outputs.tag }}

      - name: Run repository checks
        if: steps.publish-target.outputs.should_publish == 'true'
        run: cargo xtask check

      - name: Skip if version is already published
        if: steps.publish-target.outputs.should_publish == 'true'
        id: published
        run: |
          if npm view "@firna/ui@${PACKAGE_VERSION}" version --registry "https://registry.npmjs.org/" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@firna/ui@${PACKAGE_VERSION} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}

      - name: Publish package
        if: steps.publish-target.outputs.should_publish == 'true' && steps.published.outputs.published != 'true'
        run: npm publish --access public
