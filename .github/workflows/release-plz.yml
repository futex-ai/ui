name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_ref:
        description: Existing vX.Y.Z tag to publish without creating a new release.
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Release From Merged Release PR
    if: github.repository == 'futex-ai/ui' && (github.event_name != 'workflow_dispatch' || inputs.publish_ref == '')
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.release-output.outputs.tag }}
      version: ${{ steps.release-output.outputs.version }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release
        id: release-plz
        uses: release-plz/action@v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release output
        if: steps.release-plz.outputs.releases_created == 'true'
        id: release-output
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          release="$(printf "%s" "${RELEASES}" | jq -cer 'map(select(.package_name == "firna-ui-release"))[0] // empty')" || {
            echo "::error title=Missing release-plz release::release-plz did not return the firna-ui-release package."
            exit 1
          }
          version="$(printf "%s" "${release}" | jq -r ".version")"
          tag="$(printf "%s" "${release}" | jq -r ".tag")"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error title=Missing release version::release-plz did not return a package version."
            exit 1
          fi
          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "::error title=Missing release tag::release-plz did not return a release tag."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish @firna/ui
    needs: release
    if: always() && github.repository == 'futex-ai/ui' && (needs.release.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_ref != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ref != '' && inputs.publish_ref || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11.7.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify npm metadata version
        run: |
          cargo xtask sync-package-version
          git diff --exit-code -- package.json package-lock.json

      - name: Verify release version
        id: version
        run: |
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ -n "${RELEASE_VERSION}" ] && [ "${package_version}" != "${RELEASE_VERSION}" ]; then
            echo "::error title=Package/release mismatch::Expected package.json ${RELEASE_VERSION}, got ${package_version}."
            exit 1
          fi
          if [ "${RELEASE_TAG}" != "v${package_version}" ]; then
            echo "::error title=Tag/version mismatch::Expected tag v${package_version}, got ${RELEASE_TAG}."
            exit 1
          fi
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ref != '' && inputs.publish_ref || needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}

      - name: Run repository checks
        run: cargo xtask check

      - name: Skip if version is already published
        id: published
        run: |
          if npm view "@firna/ui@${PACKAGE_VERSION}" version --registry "https://registry.npmjs.org/" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@firna/ui@${PACKAGE_VERSION} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}

      - name: Publish package
        if: steps.published.outputs.published != 'true'
        run: npm publish --access public

  release-pr:
    name: Update Release PR
    if: github.repository == 'futex-ai/ui' && (github.event_name != 'workflow_dispatch' || inputs.publish_ref == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release-pr
        id: release-plz
        uses: release-plz/action@v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out release PR branch
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != 'null'
        id: release-pr
        env:
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch="$(printf "%s" "${RELEASE_PR}" | jq -r ".head_branch")"
          version="$(printf "%s" "${RELEASE_PR}" | jq -r ".releases[0].version")"
          if [ -z "${branch}" ] || [ "${branch}" = "null" ]; then
            echo "::error title=Missing release PR branch::release-plz did not return a head branch."
            exit 1
          fi
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error title=Missing release version::release-plz did not return a package version."
            exit 1
          fi
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          git checkout -B "${branch}" "origin/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sync npm metadata
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != 'null'
        run: cargo xtask sync-package-version --version "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ steps.release-pr.outputs.version }}

      - name: Commit synced npm metadata
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != 'null'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "npm metadata already matches release-plz version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync npm package version"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${RELEASE_BRANCH}"
