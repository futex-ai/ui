name: Publish npm

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @firna/ui
    if: github.repository == 'futex-ai/ui'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11.7.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify npm metadata version
        run: |
          cargo xtask sync-package-version
          git diff --exit-code -- package.json package-lock.json

      - name: Run repository checks
        run: cargo xtask check

      - name: Resolve package version
        id: version
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag="${GITHUB_REF_NAME}"
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          if [ "${tag}" != "v${version}" ]; then
            echo "::error title=Tag/version mismatch::Expected tag v${version}, got ${tag}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Skip if version is already published
        id: published
        run: |
          if npm view "@firna/ui@${PACKAGE_VERSION}" version --registry "https://registry.npmjs.org/" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@firna/ui@${PACKAGE_VERSION} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}

      - name: Publish package
        if: steps.published.outputs.published != 'true'
        run: npm publish --access public
